name: Java CI
on:
  push:
    branches: [ "fix0826" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: set-env-java8
      uses: actions/setup-java@v2
      with:
        java-version: '8'
        distribution: 'adopt'
        cache: maven
    - name: maven build
      run: mvn -U clean install -D maven.test.skip=true -D maven.javadoc.skip=true -am package