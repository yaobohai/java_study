name: Actions
on: [push
jobs:
  build-runner:
    runs-on: ubuntu-latest
    - name: Checkout Repository
      uses: actions/checkout@v2
    - name: set-env-java8
      uses: actions/setup-java@v2
      with:
        java-version: '8'
        distribution: 'adopt'
    - name: maven build
      run: mvn -U clean install -D maven.test.skip=true -D maven.javadoc.skip=true -am package
      env:
        TZ: 'Asia/Shanghai' # 设置时区